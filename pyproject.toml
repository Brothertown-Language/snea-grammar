[project]
name = "snea-grammar"
version = "0.1.0"
description = "SNEA grammar knowledge base — PSNEA grammar with per-language realization layers, rendered descriptive/teaching/prescriptive"
requires-python = "~=3.12"
dependencies = [
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snea_grammar"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
