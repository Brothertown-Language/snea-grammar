# PSN-RUL-012 — The š/s question: RESOLVED by layered analysis (evidence-based,
# superseding the earlier "both positions disputed" framing).
# Sources: Costa 2007 p. 89 (verbatim, citing Goddard 1978:75 and 1981:59) —
# costa2007.txt ll. 320-324; Goddard 1981 §§6, 10, 24-26 (goddard-1981-mass-
# phonology.txt, fetched from Carleton OJS 2026-10-16); Goddard 1980 §1, §2.4
# (goddard1980.txt); Oxford's Goddard-1981-based consonant-change notes
# (home.cc.umanitoba.ca/~oxfordwr/algling/consonantchanges.html, fetched
# 2026-10-16). Direct survey of the tracked eliot-tritext Eliot column
# (58,209 tokens) corroborates the distribution.
id: PSN-RUL-012
kind: rule
title: The š/s question resolved — PA *š merged with s; Massachusett š is a new phoneme from sound law and clusters
statement: >-
  The apparent conflict between the two recorded positions dissolves under
  the layered analysis, which the tracked and primary sources state jointly:

  1. THE MERGER (Goddard 1978:75, as quoted verbatim by Costa 2007: "older
  PA *š had already merged with *s in all EA languages north of
  Delaware-Mahican"; corroborated by Goddard 1980 §1 — *š survives into PEA
  and merges per daughter language — and Goddard 1981 §6: "PA *s and *š fall
  together to Mass /s/"): the ANCESTOR had no distinct š phoneme from *š.
  The practical consequence for the knowledge base: inherited *š surfaces as
  plain s, which is why Eliot's text is full of plain sC clusters (survey:
  sk 383, st 111, squ 105, sp 40 occurrences).

  2. THE NEW PHONEME (Goddard 1981 §10: "Mass /š/ is a new phoneme"):
  Massachusett DOES have a phonemic /s/ vs /š/ contrast at Eliot's time
  (Goddard's minimal pair: us 'say to him' /as/ vs ush 'go!' /aš/), but the
  š's sources are late, not inherited: (a) word-final PEA *r → š by law c
  (PSN-RUL-008) — the survey's 1,238 word-final ‹sh› tokens; (b) the cluster
  reflexes — PEA *hr and *hθ (from PA *θl/*nθ and *hl/*hθ/*ʔθ) give
  Massachusett /š/, written (sh, hsh, shsh) — Goddard 1981 §§24-25 with the
  derivations nushau 'he kills' < PA *ne·θe·wa, nahnashau 'he breathes' <
  *θe·hθe·wa, kushim < *ke·θemya, n8sh 'my father' < *no·hθa, and Costa 2007's
  fuller set (nuppomuhsham 'I walk' < PA *pemwehθe-, nushwe 'three' <
  *neθθwi, muhshoon 'boat' < PEA *mahθar, moshipsqut 'flint' <
  *manθ-i·peθkw-, nahshauonk, nahshont, owohshaog, koohshog) — the survey's
  704 standalone medial ‹sh› tokens (434 before vowels, 265 before
  consonants) are predicted to track these cluster derivations; (c) English
  loans (Goddard 1981 §10: shepsemesoh 'lambs' [Gen 33:19]); (d) the
  Martha's Vineyard dialect demonstrative shanuh.

  3. THE TRUMBULL-CARD ROW EXPLAINED: the card's "PA *š → sh,
  phonemically distinct" row (with its ashpowau 'above' example) misattributes
  the cluster-derived and θ-derived sh to inherited *š. Eliot's ‹sh› is
  real and contrastive — but its sources are law c, the PEA h-clusters, and
  θ-chains, not PA *š. Fielding's Mohegan-Pequot analysis shows the same
  shape from the south: PA *š → s (eškwa·nte·mi → ...sqôt) and PA *θ → sh
  before clusters → collapses to s (θkwe·hsa → shkwáhs → sqáhs).

  4. THE MUTATION AND SYNCOPE TRACES: PA *θ → *s mutation continues in
  Massachusett as /n/ → /s/ in TA-imperative and theme-3 positions (Goddard
  1981 §10); and inherited *š can surface in ‹sh›/‹z› spellings in the
  vowel-syncopation context (Goddard 1981 §6: kezheau 'he creates him' — an
  orthographic trace, not a phonemic distinction).

  RESIDUAL OPEN ITEM: the etymology of ‹nashpe› is unverified in the
  surveyed sources (explicit gap — flagged, not papered over). The literal
  wording of Goddard 1978:75 remains a documented gap (HathiTrust and
  archive.org gated; verified through Costa 2007's verbatim quotation and
  the fetched Goddard 1980/1981 primary PDFs).
evidence_tier: 2
source_anchors:
