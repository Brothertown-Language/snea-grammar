realizations:
  PSNEA: "no distinct š phoneme from inherited *š; š appears only as law c's word-final product, the hš cluster, and θ-chain products"
  Massachusett: "s/š phonemic contrast at Eliot's time; sh = law c finals + cluster reflexes (sh/hsh/shsh) + loans"
  Mohegan-Pequot: "PA *š → s; PA *θ → sh before clusters → s (Fielding 2005 chains, adjusted per Dr. Cunningham where applicable)"
norm_status:
  state: provisional
row_status: attested
