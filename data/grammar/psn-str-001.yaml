# PSN-STR-001 — Person and obviation are attested in SNEA (tier 1).
# Anchor: the tracked Costa 2007 mirror, which records Eliot's Massachusett
# obviative attestations: l. 1054 "Eliot (1663, Mark 10:6) attests an
# obviative ‹ninnuoh› 'male'"; l. 630-631 the obviative ‹ahchunkquoh›
# 'a dead body' (Eliot 1663, Numbers 19:11); l. 887 the conjunct form
# ‹wesôag› (phonemic wisôck; Eliot 1663, Psalms 68:13).
id: PSN-STR-001
kind: structure
title: Person inflection and obviative marking in the SNEA noun/verb system
statement: >-
  The SNEA languages inflect words for person and mark obviative nominals.
  This is attested, not inferred: Eliot's Massachusett writes obviative
  nominal forms (‹ninnuoh› 'male', Mark 10:6; ‹ahchunkquoh› 'a dead body',
  Numbers 19:11) and conjunct-order verbal forms (‹wesôag›, phonemic
  wisôck, Psalms 68:13), as recorded by Costa 2007 in the tracked mirror.
evidence_tier: 1
source_anchors:
  - corpus/docs/research/sources/costa2007.txt
surface_form: ninnuoh
realizations:
  PSNEA: "obviative marking on animate nominals — reconstruction pending (Phase 1)"
  Massachusett: "attested obviative ‹ninnuoh› (Eliot 1663, Mark 10:6, via Costa 2007)"
norm_status:
  state: provisional
