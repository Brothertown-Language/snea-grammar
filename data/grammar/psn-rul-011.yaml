# PSN-RUL-011 — Preaspiration hC retention (tier 1 attestation + the
# developer-directed Cunningham adjustment). The preaspirated forms are
# attested in the recorders who write them: Edwards 1787 (e.g.
# "kpehtuhquiffeh, thou art tall" — tracked mirror l. 3374) and
# Prince & Speck 1904 (e.g. "pahkahkshaas" — l. 417).
# ADJUSTMENT (developer-directed, 2026-10-16): per Dr. Keith Cunningham's
# adjustments (private/sound change adjustments.md, used in preference to
# the Fielding chains), PA *hp and *xp retain hp across Mohegan, Delaware,
# and Wampanoag — replacing Fielding's cp/kp/chep variants.
id: PSN-RUL-011
kind: rule
title: Preaspiration — breathy h before stops (hp/ht/hk), retained; routinely omitted by colonial recorders
statement: >-
  The SNEA languages retain preaspiration: a breathy h before a stop
  consonant (hp, ht, hk). The recorders who write it attest it directly —
  Edwards 1787 (‹kpehtuhquiffeh› 'thou art tall', with the kp- and -ht-
  sequences) and Prince & Speck 1904 (‹pahkahkshaas›, with -hk-). Dr.
  Keith Cunningham's adjustments (used in preference to the Fielding chains
  per the developer's direction) state the cluster rule explicitly: PA *hp
  and *xp give hp in Mohegan, Delaware, AND Wampanoag alike — preaspiration
  retained across the family, not reduced to plain stops. The standing
  recorder-failure caveat remains: most colonial-era recorders routinely
  failed to hear and write the preaspiration, so its absence in a source is
  a property of the recorder, not evidence against the feature — the
  preaspiration /h/ gap, the single most important cross-source finding of
  the snea-phonetics research cards. Any record built from a colonial
  source must account for the recorder's practice before treating an
  unwritten h as absent.
evidence_tier: 1
source_anchors:
  - corpus/docs/research/sources/edwards-1787-observations-fulltext.txt
  - corpus/docs/research/sources/prince-speck-1904.txt
  - private/sound change adjustments.md
realizations:
  PSNEA: "preaspiration retained: h before stops (hp/ht/hk)"
  Massachusett: "hC clusters retained in the language; colonial transcriptions routinely omit the h"
  Mohegan-Pequot: "hp retained (Cunningham adjustment; written by the recorders who heard it)"
  Delaware: "hp retained (Cunningham adjustment)"
  Wampanoag: "hp retained (Cunningham adjustment)"
norm_status:
  state: provisional
row_status: attested
